name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Never cancel a run that may reach the release job

jobs:
  validate-wrapper:
    permissions:
      contents: read
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Validate the checksum of gradle-wrapper.jar
        uses: gradle/actions/wrapper-validation@v6

  commit-messages:
    permissions:
      contents: read
    name: Commit messages
    if: github.event_name == 'pull_request'
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # The whole branch is validated, not just its head
      - name: 'Set up JDK 21'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Check commit messages and pull request title
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}  # Squash merges turn the title into the commit subject
        run: ./gradlew checkCommitMessages -Pcommits.base="origin/$BASE_REF" -Ppr.title="$PR_TITLE" --no-daemon

  build-ubuntu-21:
    permissions:
      contents: read
      actions: write
    name: Build (Ubuntu JDK 21)
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK 21'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan
      - name: Upload Test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ubuntu-latest-jdk_21-test-reports # Specific artifact name for JDK 21
          path: |
            build/test-results/**/*.xml
            build/jacoco/

  build-ubuntu-25:
    permissions:
      contents: read
    name: Build (Ubuntu JDK 25)
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK 25'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan
      # No artifact upload for this job as it's not needed for Sonar

  build-other-os:
    permissions:
      contents: read
    name: Build (${{ matrix.operating-system }} JDK ${{ matrix.java-version }})
    needs: validate-wrapper
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ macos-latest, windows-latest ]
        java-version: [ 21, 25 ]

    steps:
      - name: Set git config for long paths
        if: matrix.operating-system == 'windows-latest'
        run: |
          git config --system core.longpaths true
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK ${{ matrix.java-version }}'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-ubuntu-21
      - build-ubuntu-25
      - build-other-os
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  configure_sonar:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    needs:
      - build-ubuntu-21
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Trigger Sonar
        env:
          GH_BASE_REF: ${{ github.base_ref }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo Triggerring Sonar
          GH_REF=${GH_REF_NAME}
          if [ '${{github.event_name}}' == 'pull_request' ]; then
            GH_REF=${GH_HEAD_REF}
          fi
          
          gh workflow run --ref $GH_REF sonar.yml \
            -f runId=${{ github.run_id }} \
            -f eventName=${{github.event_name}} \
            -f prNumber=${{ github.event.number }} \
            -f baseRef=${GH_BASE_REF} \
            -f headRef=${GH_HEAD_REF} \
            -f jdk_version=21
