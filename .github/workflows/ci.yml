name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Never cancel a run that may reach the release job

jobs:
  validate-wrapper:
    permissions:
      contents: read
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the checksum of gradle-wrapper.jar
        uses: gradle/actions/wrapper-validation@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

  commit-messages:
    permissions:
      contents: read
    name: Commit messages
    if: github.event_name == 'pull_request'
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # The whole branch is validated, not just its head
      - name: 'Set up JDK 21'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Check commit messages and pull request title
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}  # Squash merges turn the title into the commit subject
        run: ./gradlew checkCommitMessages -Pcommits.base="origin/$BASE_REF" -Ppr.title="$PR_TITLE" --no-daemon

  build-ubuntu-21:
    permissions:
      contents: read
    name: Build (Ubuntu JDK 21)
    needs: validate-wrapper
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Job-level so the analysis step can test it in an `if`
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK 21'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ubuntu-latest-jdk_21-sonar
          restore-keys: ubuntu-latest-jdk_21-sonar

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan
      - name: Sonar analysis
        # Fork pull requests are never given repository secrets, so the scan would fail with a red X the contributor
        # cannot clear. The scanner reads the pull request context straight from the event it is running on.
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --no-daemon --scan

  build-ubuntu-25:
    permissions:
      contents: read
    name: Build (Ubuntu JDK 25)
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK 25'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan

  build-other-os:
    permissions:
      contents: read
    name: Build (${{ matrix.operating-system }} JDK ${{ matrix.java-version }})
    needs: validate-wrapper
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ macos-latest, windows-latest ]
        java-version: [ 21, 25 ]

    steps:
      - name: Set git config for long paths
        if: matrix.operating-system == 'windows-latest'
        run: |
          git config --system core.longpaths true
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Set up JDK ${{ matrix.java-version }}'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: Check Java version
        run: java -version
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./gradlew build --continue --no-daemon --scan

  # Stable check name for branch protection: the matrix reports as "Build (<os> JDK <version>)", so protecting the
  # combinations directly silently stops covering them whenever the matrix changes.
  build-matrix-result:
    permissions:
      contents: read
    name: Build (all platforms)
    runs-on: ubuntu-latest
    needs: build-other-os
    if: always()  # A skipped job never reports, so without this a failing matrix leaves the check pending forever
    steps:
      - name: Check matrix result
        env:
          MATRIX_RESULT: ${{ needs.build-other-os.result }}
        run: |
          if [ "$MATRIX_RESULT" != 'success' ]; then
            echo "build-other-os concluded: $MATRIX_RESULT"
            exit 1
          fi

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-ubuntu-21
      - build-ubuntu-25
      - build-other-os
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
