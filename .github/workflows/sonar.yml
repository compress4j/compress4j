name: Sonar
on:
  workflow_dispatch:
    inputs:
      runId:
        description: 'Run ID'
        required: true
      eventName:
        description: 'Event type'
        required: true
        default: 'workflow_dispatch'
      prNumber:
        description: 'Pull Request number'
        required: false
      baseRef:
        description: 'Base git reference'
        required: false
      headRef:
        description: 'Head git reference'
        required: false
      jdk_version:
        description: 'JDK version'
        required: true
        default: 21

jobs:
  sonar:
    permissions:
      contents: read
      actions: read  # Reading the test report artifacts of the build run that triggered this one
    name: Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: "Set up JDK ${{ github.event.inputs.jdk_version }}"
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ github.event.inputs.jdk_version }}
          distribution: 'temurin'
          cache: 'gradle'
      - name: "Download JDK ${{ github.event.inputs.jdk_version }} Test reports"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Unpacked straight into build/ so the exec files land in build/jacoco/, where the coverage report reads them
          path: build
          merge-multiple: true
          pattern: "ubuntu-latest-jdk_${{ github.event.inputs.jdk_version }}-test-reports"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.runId }}
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: "ubuntu-latest-jdk_${{ github.event.inputs.jdk_version }}-sonar"
          restore-keys: "ubuntu-latest-jdk_${{ github.event.inputs.jdk_version }}-sonar"
      - name: Create coverage report and run Sonar analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event.inputs.eventName }}
          BASE_REF: ${{ github.event.inputs.baseRef }}
          HEAD_REF: ${{ github.event.inputs.headRef }}
          PR_NUMBER: ${{ github.event.inputs.prNumber }}
        run: |
          # The test tasks are excluded: their coverage data was downloaded from the build run that triggered this one
          ARGS=(sonar --no-daemon -x test -x xzSupportTest -x integrationTest)

          if [ "$EVENT_NAME" == 'pull_request' ]; then
            ARGS+=(
              "-Dsonar.pullrequest.base=$BASE_REF"
              "-Dsonar.pullrequest.branch=$HEAD_REF"
              "-Dsonar.pullrequest.key=$PR_NUMBER"
              -Dsonar.pullrequest.provider=GitHub
              "-Dsonar.pullrequest.github.repository=${{ github.repository }}"
            )
          fi

          ./gradlew "${ARGS[@]}"
        shell: bash
