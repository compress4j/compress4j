name: Release
on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Only compute the release plan, do not tag or publish'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only compute the release plan, do not tag or publish'
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # The version is derived from the tags and the commits that followed them
      - name: 'Set up JDK 21'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compute the release plan
        id: plan
        run: |
          ./gradlew writeSemverPlan --no-daemon
          cat build/semver/plan.properties >> "$GITHUB_OUTPUT"
          {
            echo '### Release plan'
            echo '```properties'
            cat build/semver/plan.properties
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        run: echo "No commit since v${{ steps.plan.outputs.previousVersion }} asks for a release."

      - name: Tag v${{ steps.plan.outputs.nextVersion }}
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.nextVersion }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"

      # git-versioning reads GITHUB_REF on Actions, so checking the tag out does not change the version. Naming the tag
      # is what makes the steps below build the release version instead of a snapshot of the branch they run on.
      - name: Verify the version resolves to v${{ steps.plan.outputs.nextVersion }}
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.nextVersion }}
          VERSIONING_GIT_TAG: v${{ steps.plan.outputs.nextVersion }}
        run: |
          resolved=$(./gradlew --quiet properties --property version --no-daemon | awk '$1 == "version:" { print $2 }')
          if [ "$resolved" != "$VERSION" ]; then
            echo "::error::Gradle resolved the version as '$resolved', the release plan asked for '$VERSION'"
            exit 1
          fi

      - name: Create a release
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          VERSIONING_GIT_TAG: v${{ steps.plan.outputs.nextVersion }}
        run: ./gradlew publish --no-daemon

      - name: Release to Maven Central
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          VERSIONING_GIT_TAG: v${{ steps.plan.outputs.nextVersion }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jreleaserFullRelease --no-daemon --stacktrace
      # Persist logs
      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jreleaser-release
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
          if-no-files-found: ignore
